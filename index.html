<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />

    <!-- Font Preloads -->
    <link
      rel="preload"
      href="/font/ArmAllegroU.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/font/ArmenianDecorativeU-Italic.ttf"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/wedding.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Հիմնական վերնագիրը -->

    <meta property="og:title" content="Սամվել և Աննա" />

      property="og:description"
      content="Սիրով հրավիրում ենք ձեզ մեր հարսանյաց հանդեսին"
    />
    <meta
      property="og:image"
      content="https://samvel-anna.vercel.app/wedding.jpg"
    />
    <meta property="og:url" content="https://samvel-anna.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter-ի համար -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Սամվել և Աննա" />
    <meta
      name="twitter:image"
      content="https://samvel-anna.vercel.app/wedding.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
